<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintWell PR File Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="container-fluid bg-primary bg-gradient text-dark py-3">
      <div class="row align-items-center justify-content-between">
        <div class="col-2 text-center">
          <img
            src="C:/Users/aron.suarnaba/Downloads/logo.png"
            alt="PrintWell Logo"
            class="rounded-circle"
            style="height: 80px"
          />
        </div>
        <div class="col-6 d-flex justify-content-center">
          <div class="input-group" style="max-width: 400px">
            <input
              id="searchInput"
              type="text"
              class="form-control"
              placeholder="Search"
              aria-label="Search files"
            />
            <button class="btn btn-success" onclick="fetchFiles()">
              Search
            </button>
          </div>
        </div>
        <div class="col-3 d-flex justify-content-end gap-4">
          <button
            class="btn btn-dark d-flex align-items-center gap-2"
            onclick="document.getElementById('fileInput').click()"
          >
            <img
              src="https://img.icons8.com/?size=100&id=UmhTDPAjTqmt&format=png&color=FFFFFF"
              alt="Upload Icon"
              width="25"
            />
            Upload
          </button>
          <input
            type="file"
            id="fileInput"
            style="display: none"
            accept="application/pdf"
            onchange="uploadFile(event)"
          />
          <button
            class="btn btn-dark d-flex align-items-center gap-2"
            onclick="exportSelected()"
          >
            <img
              src="https://img.icons8.com/?size=100&id=EJTFhhIgyGmj&format=png&color=FFFFFF"
              alt="Export Icon"
              width="25"
            />
            Export
          </button>
        </div>
      </div>
    </header>

    <main class="container-fluid mt-4">
      <div class="row p-3 text-center">
        <div class="col-md-8 table-responsive">
          <table
            class="table table-hover table-bordered justify-content-center"
            id="fileTable"
          >
            <thead class="table-primary">
              <tr>
                <th>No.</th>
                <th>File Name</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="fileTableBody"></tbody>
          </table>
        </div>
        <div class="col-md-4">
          <iframe
            id="pdfPreview"
            width="100%"
            height="1000px"
            frameborder="0"
          ></iframe>
        </div>
      </div>
    </main>

    <script>
      async function fetchFiles() {
        const res = await fetch("http://localhost:3000/api/pr-scanned-list");
        const files = await res.json();

        const searchQuery = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();

        const filteredFiles = files.filter((file) =>
          file.name.toLowerCase().includes(searchQuery)
        );

        const tbody = document.getElementById("fileTableBody");
        tbody.innerHTML = "";

        if (filteredFiles.length === 0) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="3" class="text-center">No files found.</td>`;
          tbody.appendChild(tr);
        } else {
          filteredFiles.forEach((file, index) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${file.name}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="previewPDF('${
              file.name
            }')">View</button>
            <button class="btn btn-sm btn-danger" onclick="deletePDF('${
              file.name
            }')">Delete</button>
          </td>`;
            tbody.appendChild(tr);
          });
        }
      }

      function previewPDF(filename) {
        const iframe = document.getElementById("pdfPreview");
        iframe.src = `http://localhost:3000/api/pr-scanned-list/view/${filename}`;
      }

      async function deletePDF(filename) {
        const res = await fetch(
          `http://localhost:3000/api/pr-scanned-list/delete/${filename}`,
          { method: "DELETE" }
        );
        if (res.ok) fetchFiles();
      }

      async function uploadFile(event) {
        const file = event.target.files[0];
        const formData = new FormData();
        formData.append("file", file);
        await fetch("http://localhost:3000/api/pr-scanned-list/upload", {
          method: "POST",
          body: formData,
        });
        fetchFiles();
      }

      async function exportSelected() {
        alert("Still in development.\nPlease contact the system programmer: Mr. Aron Kyle Suarnaba");
      }

      window.onload = () => {
        fetchFiles();
        document.getElementById("searchInput").addEventListener("keyup", fetchFiles);
        };

    </script>
  </body>
</html>
