<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid bg-primary bg-gradient text-dark">

        <div class="row py-3 align-items-center justify-content-around wrap">

            <div class="col-auto">
                <img src="asset/Printwell_logo.jpg" alt="Logo" class="rounded-circle" style="height: 80px;">
            </div>


            <div class="col justify-content-center">
                <div class="input-group">
                    <input type="text" class="form-control mw-70" placeholder="Search" style="max-width: 300px;">
                    <button class="btn btn-success" type="submit">Enter</button>
                </div>
            </div>

            <div class="col d-flex align-items-center justify-content-center gap-3">
                <button type="button" class="btn btn-secondary">Upload</button>
                <button type="button" class="btn btn-secondary">Export</button>
            </div>

        </div>

    </div>

    <div class="row text-center py-5">
        <div class="col">

        </div>

        <div class="col table-responsive">
            <table class="table table-striped table-hover">
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 40%;">
                    <col style="width: 20%;">
                    <col style="width: 20%;">
                </colgroup>
                <tr>
                    <th>No.</th>
                    <th>File Name</th>
                    <th>Type</th>
                    <th>Size</th>
                </tr>
                <tr>
                    <th>1</th>
                    <th>Hello</th>
                    <th>pdf</th>
                    <th>12mb</th>
                </tr>
            </table>
        </div>

        <div class="col">

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
