<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <div class="container-fluid bg-primary bg-gradient text-dark">

        <!-- Ito yung header niya kung saan nakalagay yung logo, search bar, upload and export function-->
        <div class="row py-3 align-items-center justify-content-between">

            <!-- Yung logo ng printwell-->
            <div class="col-2 text-center">
                <img src="asset/Printwell_logo.jpg" alt="Logo" class="rounded-circle" style="height: 80px;" />
            </div>

            <!-- Ito yung searchbar para mahanap ang specific item na hinahanap-->
            <div class="col-6 d-flex justify-content-center">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" class="form-control" placeholder="Search" />
                    <button class="btn btn-success" type="submit">Enter</button>
                </div>
            </div>

            <!--Ito yung upload function para mag dagdag ng files sa table-->
            <div class="col-3 d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-dark d-flex align-items-center gap-1">
                    <img src="https://img.icons8.com/?size=100&id=UmhTDPAjTqmt&format=png&color=000000" alt="Upload-logo" style="width: 25px;" />
                    Upload
                </button>

                <!--Ito yung export para ma retrieve mo files mo sa local files mo-->
                <button type="button" class="btn btn-dark d-flex align-items-center gap-1">
                    <img src="https://img.icons8.com/?size=100&id=EJTFhhIgyGmj&format=png&color=000000" alt="ExportLogo" style="width: 25px;" />
                    Export
                </button>
            </div>

        </div>
    </div>

    <!-- Ito yung header main content -->
    <main class="container-fluid">
        <div class="row text-center p-5">

            <!--Ito po yung table kung saan naka display yung mga files-->
            <div class="col-md-8 table-responsive">
                <table class="table table-hover table-bordered">
                    <colgroup>
                        <col style="width: 5;">
                        <col style="width: 65;">
                        <col style="width: 10;">
                        <col style="width: 15;">
                    </colgroup>

                    <thead class="table-info">
                        <tr>
                            <th>No.</th>
                            <th>File Name</th>
                            <th>Type</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr onclick="selectRow(this)">
                            <td>1</td>
                            <td>Hello</td>
                            <td>PDF</td>
                            <td>12MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>2</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>

                        <tr onclick="selectRow(this)">
                            <td>3</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>4</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>5</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>6</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>7</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>8</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>9</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                        <tr onclick="selectRow(this)">
                            <td>10</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>
                    </tbody>
                </table>

            </div>


            <div class="col-md-4">
                <img src="https://www.w3schools.com/bootstrap5/paris.jpg" alt="">
            </div>



        </div>

        <div class="row text-center justify-content-center align-items-center p-5">

            <div class="col-8">
                <div class="input-group d-flex gap-4">
                    <button class="btn btn-primary btn d-flex align-items-center justify-content-center gap-1" type="button"><img src="https://img.icons8.com/?size=100&id=11926&format=png&color=000000" alt="edit-logo" style="width: 25PX;">Edit</button>
                    <button class="btn btn-danger" type="button">Delete</button>
                    <button class="btn"></button>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function selectRow(row) {
            const rows = document.querySelectorAll("table tbody tr");
            rows.forEach(r => r.classList.remove("table-active"));

            row.classList.add("table-active");
        }
    </script>
</body>

</html>
