<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrintWell Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

    <!-- Header Section -->
    <header class="container-fluid bg-primary bg-gradient text-dark py-3">
        <div class="row align-items-center justify-content-between">

            <!-- Logo -->
            <div class="col-2 text-center">
                <img src="asset/Printwell_logo.jpg" alt="PrintWell Logo" class="rounded-circle" style="height: 80px;" />
            </div>

            <!-- Search Bar -->
            <div class="col-6 d-flex justify-content-center">
                <div class="input-group" style="max-width: 400px;">
                    <input type="text" class="form-control" placeholder="Search" aria-label="Search files" />
                    <button class="btn btn-success" type="submit">Search</button>
                </div>
            </div>

            <!-- Upload & Export Buttons -->
            <div class="col-3 d-flex justify-content-end gap-2">
                <button class="btn btn-dark d-flex align-items-center gap-2">
          <img src="https://img.icons8.com/?size=100&id=UmhTDPAjTqmt&format=png&color=FFFFFF" alt="Upload Icon" width="25" />
          Upload
        </button>

                <button class="btn btn-dark d-flex align-items-center gap-2">
          <img src="https://img.icons8.com/?size=100&id=EJTFhhIgyGmj&format=png&color=FFFFFF" alt="Export Icon" width="25" />
          Export
        </button>
            </div>

        </div>
    </header>

    <!-- Main Content -->
    <main class="container-fluid mt-4">
        <div class="row text-center p-3 gy-4">

            <!-- File Table -->
            <div class="col-md-8 table-responsive">
                <table class="table table-hover table-bordered">
                    <colgroup>
                        <col style="width: 5%;">
                        <col style="width: 65%;">
                        <col style="width: 10%;">
                        <col style="width: 15%;">
                    </colgroup>

                    <thead class="table-primary">
                        <tr>
                            <th>No.</th>
                            <th>File Name</th>
                            <th>Type</th>
                            <th>Size</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Sample Rows -->
                        ${[...Array(13)].map((_, i) => `
                        <tr onclick="selectRow(this)">
                            <td>${i + 1}</td>
                            <td>World</td>
                            <td>DOCX</td>
                            <td>30MB</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>

            <!-- Preview Image -->
            <div class="col-md-4">
                <img src="https://www.w3schools.com/bootstrap5/paris.jpg" alt="Preview" class="img-thumbnail mx-auto d-block">
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="row text-center justify-content-center align-items-center p-4">
            <div class="col-8">
                <div class="d-flex gap-4 justify-content-center">
                    <button class="btn btn-primary bg-gradient d-flex align-items-center gap-2" type="button">
            <img src="https://img.icons8.com/?size=100&id=11926&format=png&color=000000" alt="Edit Icon" width="25" />
            Edit
          </button>
                    <button class="btn btn-danger bg-gradient d-flex align-items-center gap-2" type="button">
            <img src="https://img.icons8.com/?size=100&id=pre7LivdxKxJ&format=png&color=000000" alt="Delete Icon" width="25" />
            Delete
          </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Row Selection Script -->
    <script>
        function selectRow(row) {
            const rows = document.querySelectorAll("table tbody tr");
            rows.forEach(r => r.classList.remove("table-active"));
            row.classList.add("table-active");
        }
    </script>
</body>

</html>
